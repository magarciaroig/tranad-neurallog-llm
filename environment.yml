name: tranad_plus
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # PyTorch con soporte CUDA para aceleración por GPU (NVIDIA RTX 3070 / CUDA 12.x / 13.0)
  - pytorch>=2.2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  # Procesamiento numérico y manipulación de datos
  - numpy>=1.24.0,<2.0.0
  - pandas>=2.1.0
  - scipy>=1.11.0
  - scikit-learn>=1.3.0
  # Visualización
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  # Entorno interactivo y utilidades
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm
  - pyyaml
  - requests
  - joblib
  - tensorboard
  - pip
  - pip:
      - torchmetrics>=1.3.0
      - python-dotenv>=1.0.0
      - pyextremes>=2.4.0
      - google-genai>=1.0.0
      - sentence-transformers>=2.2.0
      - litellm>=1.40.0

